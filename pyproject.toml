[project]
name = "jj-supersede"
version = "0.1.0"
description = "Detect function-level code supersession via jj predecessor chains + tree-sitter"
readme = "README.md"
authors = [
    { name = "Vitaly D.", email = "netmin@pm.me" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
    "tree-sitter>=0.25.2",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.1",
]

[project.scripts]
jj-supersede = "jj_supersede.cli:main"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
